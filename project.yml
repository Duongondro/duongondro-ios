name: Duongondro
options:
  bundleIdPrefix: app.duongondro
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.5"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set locally (local.mk); never commit a personal team id
    CODE_SIGN_STYLE: Automatic
packages:
  DuongondroCore:
    path: Core
targets:
  Duongondro:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: DuongondroCore
        product: DuongondroCore
      - package: DuongondroCore
        product: DuongondroStore
      - package: DuongondroCore
        product: DuongondroCrypto
      - package: DuongondroCore
        product: DuongondroAPI
      - package: DuongondroCore
        product: DuongondroSync
      - package: DuongondroCore
        product: DuongondroQR
      - target: DuongondroNotifications
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Duongöndro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The sealing uses only the encryption in Apple's OS (CryptoKit, plus the
        # Keychain and HTTPS): App Store Connect's questionnaire then asks for no
        # documentation, so uploads declare it here instead of asking each time.
        # Bundling a crypto library of our own (or any non-standard algorithm)
        # changes the answer: docs/12-release-checklist.
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, de, ru, uk, pl, cs, sk, hu, es, fr]
        # Resources in groups are copied flat into the bundle root, so bare names.
        UIAppFonts: [IBMPlexSans-SemiBold.ttf, IBMPlexSans-Bold.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.duongondro.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # Universal Links (invite and magic links) and passkeys on duongondro.app,
        # matched by the site's apple-app-site-association; push; and the app group
        # shared with the notification extension. Signing needs the App ID's Associated
        # Domains, Push Notifications and App Groups capabilities in the profile.
        CODE_SIGN_ENTITLEMENTS: App/Duongondro.entitlements
        # aps-environment in the entitlements: development in every configuration.
        # Every build here is signed with a development profile, which refuses
        # production (`make device` and the `make testflight` archive included); the
        # App Store export re-signs with the distribution profile and writes
        # production. Which APNs a token belongs to is read at run time from the
        # profile the app was signed with (PushPlatform), never from this setting.
        APS_ENVIRONMENT: development
    preBuildScripts:
      - name: Build identity
        script: "\"$SRCROOT/Scripts/build-info.sh\""
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/BuildInfo.plist
          - $(DERIVED_FILE_DIR)/Contributors.json
    postBuildScripts:
      - name: Copy build identity
        script: |
          cp "$DERIVED_FILE_DIR/BuildInfo.plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BuildInfo.plist"
          cp "$DERIVED_FILE_DIR/Contributors.json" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Contributors.json"
        basedOnDependencyAnalysis: false
      # Plain HTTP only to this Mac's development server, and only in Debug builds
      # (their default server); Release has no exception, so everything is HTTPS.
      - name: Allow local networking in Debug
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
          fi
          touch "$DERIVED_FILE_DIR/local-networking.stamp"
        # The processed Info.plist as input, so this runs after it is written.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(DERIVED_FILE_DIR)/local-networking.stamp
        basedOnDependencyAnalysis: false
  # Renders the server's pushes in the app's language, with practice names and
  # Discreet notifications (design: Localisation › Localised pushes). Reads the strings
  # from the app's bundle and the settings from the app group.
  DuongondroNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: Notifications
        excludes: [Info.plist]
    dependencies:
      - package: DuongondroCore
        product: DuongondroCore
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleDisplayName: Duongöndro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.duongondro.ios.notifications
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Notifications/DuongondroNotifications.entitlements
        # Strings are the app's: nothing to extract here.
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  Duongondro:
    build:
      targets:
        Duongondro: all
    run:
      config: Debug
    archive:
      config: Release
