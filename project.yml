name: Duongondro
options:
  bundleIdPrefix: app.duongondro
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set locally (local.mk); never commit a personal team id
    CODE_SIGN_STYLE: Automatic
packages:
  DuongondroCore:
    path: Core
targets:
  Duongondro:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: DuongondroCore
        product: DuongondroCore
      - package: DuongondroCore
        product: DuongondroStore
      - package: DuongondroCore
        product: DuongondroCrypto
      - package: DuongondroCore
        product: DuongondroAPI
      - package: DuongondroCore
        product: DuongondroSync
      - package: DuongondroCore
        product: DuongondroQR
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Duongöndro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # No encryption beyond the system's yet. Becomes true with phase 3's sealing
        # (standard algorithms, the mass-market exemption): docs/12-release-checklist.
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, de, ru, uk, pl, cs, sk, hu, es]
        # Resources in groups are copied flat into the bundle root, so bare names.
        UIAppFonts: [IBMPlexSans-SemiBold.ttf, IBMPlexSans-Bold.ttf]
        # Plain HTTP only to this Mac's development server (debug builds' default);
        # everything else stays HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.duongondro.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Build identity
        script: "\"$SRCROOT/Scripts/build-info.sh\""
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/BuildInfo.plist
          - $(DERIVED_FILE_DIR)/Contributors.json
    postBuildScripts:
      - name: Copy build identity
        script: |
          cp "$DERIVED_FILE_DIR/BuildInfo.plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BuildInfo.plist"
          cp "$DERIVED_FILE_DIR/Contributors.json" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Contributors.json"
        basedOnDependencyAnalysis: false
schemes:
  Duongondro:
    build:
      targets:
        Duongondro: all
    run:
      config: Debug
    archive:
      config: Release
